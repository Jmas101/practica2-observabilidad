
global:
  resolve_timeout: 5m

route:
  receiver: webhook-local
  group_by:
    - alertname
    - severity
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: webhook-local
    webhook_configs:
      - url: http://alert-webhook:5001/alerts
        send_resolved: true
