
services:

  # BASE DE DATOS
  db:
    image: postgres:16-alpine
    container_name: practica2-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citasdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # BACKEND
  backend:
    build: ./app/backend
    container_name: practica2-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-citasdb}
      APP_ENV: ${APP_ENV:-development}
      ERROR_RATE: ${ERROR_RATE:-0}
      LATENCY_MS: ${LATENCY_MS:-0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # GATEWAY
  gateway:
    build: ./app/gateway
    container_name: practica2-gateway
    ports:
      - "8080:8000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # PROMETHEUS
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: practica2-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
    restart: unless-stopped

  # ALERTMANAGER
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: practica2-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      alert-webhook:
        condition: service_healthy
    restart: unless-stopped

  # RECEPTOR DE ALERTAS
  alert-webhook:
    build: ./alert-webhook
    container_name: practica2-alert-webhook
    expose:
      - "5001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # NODE EXPORTER - COMPATIBLE CON DOCKER DESKTOP
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: practica2-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    expose:
      - "9100"
    restart: unless-stopped

  # CADVISOR
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: practica2-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
