
# ==========================================
# CONFIGURACION GLOBAL
# ==========================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ==========================================
# REGLAS DE ALERTA
# ==========================================

rule_files:
  - /etc/prometheus/alert.rules.yml

# ==========================================
# CONEXION CON ALERTMANAGER
# ==========================================

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ==========================================
# SERVICIOS MONITORIZADOS
# ==========================================

scrape_configs:

  # Prometheus
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Backend FastAPI
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  # Node Exporter
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  # cAdvisor
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
